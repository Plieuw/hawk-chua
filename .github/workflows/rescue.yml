# The FM1 Open rescue (open/rescue): a working FM1 Open firmware for fm1_open_rescue.sh to put back, Orkest V14 built
# from github.com/Plieuw/orkest (v14/), as the pre-release fm1-open-rescue.
name: fm1-open-rescue

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl xz-utils python3 >/dev/null
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/gh.gpg
          echo "deb [signed-by=/usr/share/keyrings/gh.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/gh.list
          apt-get update -qq && apt-get install -y -qq gh >/dev/null

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Plieuw/orkest
          path: orkest

      - name: Cache the JieLi toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/jieli
          key: jieli-toolchain-open-v1

      - name: JieLi toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh /opt/jieli

      - name: Orkest V14
        run: |
          set -e
          mkdir -p rescue
          python3 orkest/v14/tools/build_open.py orkest/v14 /opt/jieli/toolchain --out rescue/orkest-v14.fwsc
          (cd rescue && sha256sum orkest-v14.fwsc > SHA256SUMS && cat SHA256SUMS)

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release delete fm1-open-rescue --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create fm1-open-rescue rescue/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "FM1 Open rescue (a working firmware for open/rescue/fm1_open_rescue.sh)" \
            --notes "Orkest V14 (github.com/Plieuw/orkest, v14/: M-VAVE FM1 Open with Orkest; GPL-3.0 with the FM1 SDK linking exception), built from orkest@$(git -C orkest rev-parse --short HEAD). fm1_open_rescue.sh puts it back on an FM-1 whose FM1 Open firmware crashes at start-up; from it, the Orkest page or M-VAVE's FM1 Workbench installs anything else."
