# The FM1 Open rescue (open/rescue): working FM1 Open firmware to put back (fm1_open_rescue.sh, or the FM-1 Transporter),
# as the pre-release fm1-open-rescue: M-VAVE's own FM1 Open (their release's .fwsc when they publish one, and built
# here from github.com/m-vave/fm1_open, unchanged), and Orkest V14 (github.com/Plieuw/orkest v14/).
name: fm1-open-rescue

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl xz-utils python3 >/dev/null
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/gh.gpg
          echo "deb [signed-by=/usr/share/keyrings/gh.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/gh.list
          apt-get update -qq && apt-get install -y -qq gh >/dev/null

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Plieuw/orkest
          path: orkest

      - uses: actions/checkout@v4
        with:
          repository: m-vave/fm1_open
          path: mvave
          lfs: false

      - name: Cache the JieLi toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/jieli
          key: jieli-toolchain-open-v1

      - name: JieLi toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh /opt/jieli

      - name: Orkest V14
        run: |
          set -e
          mkdir -p rescue
          python3 orkest/v14/tools/build_open.py orkest/v14 /opt/jieli/toolchain --out rescue/orkest-v14.fwsc

      - name: M-VAVE's FM1 Open, built from their source (unchanged)
        run: |
          set -e
          git -C mvave log -1 --format='m-vave/fm1_open %h %ci %s' | tee rescue/mvave-source.txt
          python3 open/rescue/build_mvave.py mvave /opt/jieli/toolchain --out rescue/mvave-fm1-open-v14.fwsc

      - name: M-VAVE's FM1 Open, their own published package (if there is one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mv && cd mv
          if gh release download --repo m-vave/fm1_open --pattern '*.fwsc' 2>/dev/null; then
            for f in *.fwsc; do cp "$f" "../rescue/mvave-official-$f"; done
            gh release view --repo m-vave/fm1_open --json tagName,publishedAt,assets | tee ../rescue/mvave-official.txt
          else
            echo "(no published .fwsc)"
          fi

      - name: Checksums
        run: (cd rescue && sha256sum *.fwsc > SHA256SUMS && cat SHA256SUMS)

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release delete open-beta1 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true   # (withdrawn)
          gh release delete fm1-open-rescue --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create fm1-open-rescue rescue/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "FM1 Open rescue: working FM1 Open firmware to put back" \
            --notes "mvave-fm1-open-v14.fwsc: M-VAVE's own FM1 Open V14, built unchanged from github.com/m-vave/fm1_open (mvave-source.txt) on Linux (open/rescue/build_mvave.py); mvave-official-*.fwsc (if present): M-VAVE's own published package. orkest-v14.fwsc: Orkest V14 (github.com/Plieuw/orkest, v14/: M-VAVE FM1 Open with Orkest; GPL-3.0 with the FM1 SDK linking exception), built from orkest@$(git -C orkest rev-parse --short HEAD). fm1_open_rescue.sh puts it back on an FM-1 whose FM1 Open firmware crashes at start-up; from it, the Orkest page or M-VAVE's FM1 Workbench installs anything else."
